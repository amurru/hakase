version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # TypeScript 7 is the native compiler and no longer exports
    # typescript/lib/tsc, which vue-tsc (3.3.x) requires at build time, so
    # every major bump breaks `pnpm build` (PR #32). Revisit when vue-tsc
    # ships TS 7 support.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
