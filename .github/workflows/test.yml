name: test

# Least privilege: jobs only check out code and run tests.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# One queue per workflow+ref; a new push supersedes the previous run on the
# same ref. The merge_group ref is ephemeral (gh-readonly-queue/*), so
# cancel-in-progress never drops a merge_group run that another ref needs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install bubblewrap (enables sandbox isolation tests)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # internal/web embeds the SPA via //go:embed all:dist; the mirror is
      # gitignored, so every Go command needs it built first (AGENTS.md).
      - name: Build frontend (go:embed mirror)
        run: |
          pnpm --dir webui install --frozen-lockfile
          pnpm --dir webui build
          rm -rf internal/web/dist
          mkdir -p internal/web/dist
          cp -r webui/dist/. internal/web/dist/

      - name: gofmt gate
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error title=gofmt::Files needing gofmt:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Go is a cross-compiler, so this compiles the whole module against
      # darwin's stdlib on the Linux runner - no macOS machine needed. It
      # would have caught #38 (a //go:build unix file using Pdeathsig, which
      # darwin's syscall package lacks) the moment it landed. Compile-only:
      # running darwin tests would need a real macOS runner.
      - name: Cross-compile check (darwin)
        run: GOOS=darwin go build ./...

      - name: Go tests
        run: go test ./...

      - name: Run installer script test harness
        run: bash packaging/install_test.sh

      - name: Frontend tests
        run: pnpm --dir webui test

  # Blocking gate since the suite went green on Windows. Bubblewrap mode is
  # coerced to paths on Windows by design, so only the paths-mode tests apply;
  # landlock is refused on every platform.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build frontend (go:embed mirror)
        shell: bash
        run: |
          pnpm --dir webui install --frozen-lockfile
          pnpm --dir webui build
          rm -rf internal/web/dist
          mkdir -p internal/web/dist
          cp -r webui/dist/. internal/web/dist/

      - name: Go tests
        run: go test ./...

  # Single required check for the protect-main ruleset. Both platforms must
  # report success; skipped/cancelled/failure all fail this job. Runs on
  # push, pull_request, and merge_group so the check is always present.
  ci-required:
    name: ci-required
    if: always()
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all CI passed
        run: |
          if [ "${{ needs.linux.result }}" != "success" ] || [ "${{ needs.windows.result }}" != "success" ]; then
            echo "linux=${{ needs.linux.result }} windows=${{ needs.windows.result }}"
            exit 1
          fi

  # Advisory only: never add this job to required checks. It only runs on
  # pull_request events, so on merge_group (and push) it is skipped and a
  # required check that can be skipped would block the queue.
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # workflow default; restated because job permissions replace it
      pull-requests: read # action-semantic-pull-request reads the PR via pulls.get
    steps:
      # Resolved 2026-11-06: amannn/action-semantic-pull-request@v6.1.2
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
