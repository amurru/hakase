# Release pipeline with SLSA L3 provenance (Option A: generic generator).
#
# Flow (triggered by pushing a release tag, e.g. `git push origin v0.1.0-alpha.2`):
#
#   1. build       - full production build via the Makefile (frontend + ldflags-
#                    stamped Go binary), builds .deb and .rpm via nfpm, creates
#                    the GitHub release and uploads binary + packages +
#                    SHA256SUMS.txt
#   2. provenance  - delegates to the SLSA generic generator reusable workflow,
#                    which signs provenance for the uploaded artifacts (keyless
#                    Sigstore signing via OIDC) and attaches it to the release
#
# The Makefile stays the single source of truth for how hakase is built; this
# workflow only orchestrates it in CI. `hakase version` output therefore
# matches the release tag exactly.
#
# Supply-chain notes:
#   - Every third-party action is pinned to a full commit SHA; the SLSA
#     reusable workflow is pinned to its release tag because slsa-verifier
#     validates against that ref (per upstream docs).
#   - The build job has no access to secrets beyond the ephemeral
#     github.token, which is scoped to contents:write for asset uploads.
#   - Provenance verification instructions: see "Verifying release binaries"
#     in README.md.

name: Release

on:
  push:
    tags:
      - "v*"

permissions: {} # nothing at the workflow level; jobs declare their own

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the binary + checksums
    outputs:
      # base64-encoded sha256sums of the staged assets; consumed by the
      # provenance job as base64-subjects.
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout (full history + tags for git describe)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.3.0

      - name: Build (make build = frontend + stamped prod binary)
        run: make build

      - name: Smoke-test the built binary
        run: ./hakase version

      - name: Install nfpm (deb/rpm packager, pinned)
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.36.0

      - name: Build deb and rpm packages
        env:
          TAG: ${{ github.ref_name }}
        run: make package-linux VERSION="$TAG"

      - name: Stage release assets
        id: stage
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp hakase "dist-release/hakase-${TAG}-linux-amd64"
          cp dist/*.deb dist/*.rpm dist-release/
          cd dist-release
          sha256sum "hakase-${TAG}-linux-amd64" *.deb *.rpm > ../SHA256SUMS.txt

      - name: Create release and upload binary + packages + checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" --clobber dist-release/hakase-"$TAG"-linux-amd64 \
            dist-release/*.deb dist-release/*.rpm SHA256SUMS.txt

      - name: Generate SLSA provenance subjects
        id: hash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Provenance covers the binary and both packages (all staged assets).
          (cd dist-release && sha256sum "hakase-${TAG}-linux-amd64" *.deb *.rpm) \
            | base64 -w0 > subjects.b64
          echo "hashes=$(cat subjects.b64)" >> "$GITHUB_OUTPUT"

  provenance:
    name: Generate SLSA provenance
    needs: [build]
    permissions:
      actions: read # read the calling workflow's info for the provenance
      id-token: write # keyless Sigstore signing of the provenance
      contents: write # attach the .intoto.jsonl to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true # attaches <binary>.intoto.jsonl to the tagged release

  # ---------------------------------------------------------------------------
  # Windows (native port, v1)
  #
  # Both jobs are independent of `build` so they never gate the Linux release
  # (Windows guardrail). The zip is uploaded as a workflow artifact for
  # debugging and also published to the GitHub release as
  # hakase-<tag>-windows-amd64.zip (unsigned - Authenticode signing and SLSA
  # subjects for the zip are the designated follow-up, code-signing spec).
  # ---------------------------------------------------------------------------

  windows-cross:
    name: Cross-compile Windows zip
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the zip to the release (gated by polling, not by needs)
    steps:
      - name: Checkout (full history + tags for git describe)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.3.0

      # make build-frontend runs first inside build-windows: a prod build
      # fails on a fresh checkout until internal/web/dist exists (go:embed
      # gotcha).
      - name: Build Windows zip (frontend + cross-compile + package)
        env:
          TAG: ${{ github.ref_name }}
        run: make build-windows VERSION="$TAG"

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hakase-${{ github.ref_name }}-windows-amd64.zip
          path: dist/hakase-${{ github.ref_name }}-windows-amd64.zip
          if-no-files-found: error

      - name: Publish Windows zip to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The build job creates the release; wait up to 5 min for it to appear
          # so this job stays non-gating (no `needs:`) but still publishes.
          for _ in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          gh release view "$TAG" >/dev/null 2>&1 || {
            echo "release $TAG not found after wait; skipping publish" >&2
            exit 0
          }
          gh release upload "$TAG" --clobber "dist/hakase-${TAG}-windows-amd64.zip"
          echo "published Windows zip to release $TAG"
          # Best-effort: keep the top-level SHA256SUMS.txt in sync.
          # Re-download the current SHA256SUMS.txt, append the Windows hash if
          # it is not already present, and re-upload.
          if gh release download "$TAG" --pattern "SHA256SUMS.txt" --dir /tmp 2>/dev/null; then
            WIN_HASH=$(sha256sum "dist/hakase-${TAG}-windows-amd64.zip" | awk '{print $1}')
            if ! grep -q "hakase-${TAG}-windows-amd64.zip" /tmp/SHA256SUMS.txt; then
              echo "${WIN_HASH}  hakase-${TAG}-windows-amd64.zip" >> /tmp/SHA256SUMS.txt
              gh release upload "$TAG" --clobber /tmp/SHA256SUMS.txt
              echo "updated SHA256SUMS.txt with Windows zip hash"
            fi
          fi

  windows-test:
    name: Windows tests and smoke
    runs-on: windows-latest
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.3.0

      # go:embed gotcha: go test ./... fails on a fresh checkout until the
      # frontend mirror exists.
      - name: Build frontend mirror
        run: make build-frontend

      - name: Run tests (zero network/MCP dependencies)
        run: go test ./...

      - name: Build native binary for smoke
        run: go build -tags prod -o hakase.exe ./cmd/hakase/

      - name: Smoke - hakase.exe version
        run: ./hakase.exe version

      # Web shutdown smoke: boot the SSE server, hit the unauthenticated
      # health endpoint, then stop it (SIGTERM is not externally deliverable
      # on Windows; ctrl-c is the documented shutdown path).
      - name: Smoke - hakase.exe web boots and serves /api/health
        env:
          HAKASE_HOME: ${{ runner.temp }}/.hakase-smoke
        run: |
          set -euo pipefail
          mkdir -p "$HAKASE_HOME"
          printf 'admin\nsmoke-test-password\nsmoke-test-password\n' | ./hakase.exe auth set-password
          ./hakase.exe web --port 18080 &
          WEB_PID=$!
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/api/health >/dev/null 2>&1; then
              echo "health OK"
              kill "$WEB_PID" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "web server did not become healthy" >&2
          kill "$WEB_PID" 2>/dev/null || true
          exit 1
